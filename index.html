<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Push-up тоолуур</title>
<style>
  :root{
    --bg:#0b0f14; --fg:#e8eef5; --dim:#7b8a9c;
    --accent:#39d98a; --warn:#ffb020; --bad:#ff5c5c; --gold:#ffd21e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .mirror{transform:scaleX(-1)}

  #hud{position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}

  #top{display:flex;align-items:flex-start;justify-content:flex-end}
  #stats{text-align:right;font-size:12px;color:rgba(255,255,255,.55);line-height:1.8;
    text-shadow:0 1px 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;
    letter-spacing:.02em}
  #stats b{color:rgba(255,255,255,.95);font-weight:700}

  #meterWrap{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:6px;height:30vh;border-radius:999px;background:rgba(255,255,255,.16);
    overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.5)}
  #meter{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--accent);
    transition:height .06s linear}
  #poseDiag{opacity:.45;font-size:10px;letter-spacing:0}

  #bottom{display:flex;flex-direction:column;gap:12px;align-items:center}
  #msg{font-size:15px;font-weight:700;padding:8px 18px;border-radius:999px;
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);min-height:36px;
    display:flex;align-items:center;text-align:center;
    text-shadow:0 1px 6px rgba(0,0,0,.9);letter-spacing:.01em}

  /* Тоолуур доод талд, шар дугуй дотор — reel дээрх загвар */
  #counter{width:clamp(92px,26vw,128px);aspect-ratio:1;border-radius:50%;
    background:var(--gold);border:5px solid rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 28px rgba(0,0,0,.5)}
  #count{font-size:clamp(42px,13vw,62px);font-weight:900;letter-spacing:-.04em;
    color:#231a00;font-variant-numeric:tabular-nums;line-height:1}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes ring{from{box-shadow:0 0 0 0 rgba(255,210,30,.65)}
                  to{box-shadow:0 0 0 30px rgba(255,210,30,0)}}
  #counter.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1), ring .55s ease-out}

  #btns{display:flex;gap:8px;pointer-events:auto}
  button{pointer-events:auto;border:0;border-radius:999px;padding:10px 18px;font-size:13px;
    font-weight:700;background:rgba(255,255,255,.13);color:rgba(255,255,255,.85);
    backdrop-filter:blur(10px)}
  button:active{transform:scale(.96)}
  button.primary{background:var(--accent);color:#04140c;padding:13px 22px;font-size:15px}

  #start{position:absolute;inset:0;background:var(--bg);z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:28px;text-align:center}
  #start h1{margin:0;font-size:30px;letter-spacing:-.02em}
  #start p{margin:0;max-width:340px;color:var(--dim);font-size:14px;line-height:1.65}
  #err{color:var(--bad);font-size:13px;max-width:340px;line-height:1.6}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="top">
      <div id="stats">
        <div>Өнцөг <b id="angle">–</b></div>
        <div>Гүн <b id="deep">–</b></div>
        <div>Хугацаа <b id="time">0:00</b></div>
        <div><b id="fps">–</b> fps</div>
        <!-- id нь window дээр глобал болдог тул MediaPipe-ийн WASM доторх
             нэрстэй мөргөлдөхгүй нэр сонгох ёстой (id="dbg" нь мөргөлдсөн) -->
        <div id="poseDiag">–</div>
      </div>
    </div>
    <div id="meterWrap"><div id="meter"></div></div>
    <div id="bottom">
      <div id="msg">Бэлдэж байна…</div>
      <div id="counter"><span id="count">0</span></div>
      <div id="btns">
        <button id="reset">Дахин эхлэх</button>
        <button id="flip">Камер солих</button>
      </div>
    </div>
  </div>

  <div id="start">
    <h1>Push-up тоолуур</h1>
    <p>Утсаа хажуу талд, шалнаас 30–50 см өндөрт тавьж, <b>бүтэн биеэ</b> камерт багтаана.
       Тохойн өнцгөөр push-up автоматаар тоологдоно.</p>
    <button class="primary" id="go">Камер асаах</button>
    <div id="err" class="hidden"></div>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");

// ---- тохируулга ----
// Тогтмол босго ажиллахгүй: камерын байрлал, биеийн харьцаанаас шалтгаалж
// нэг хүний доод цэг 129°, нөгөөгийнх 70° байж болно. Тиймээс ажиглагдсан
// хэлбэлзлийн мужаас босгыг өөрөө гаргана.
const MIN_REP_MS = 180;   // үүнээс богино rep-ийг чимээ гэж үзнэ
const MIN_SWING  = 35;    // тохой ийм хэмжээгээр хэлбэлзээгүй бол rep биш
const BAD_FRAMES = 5;     // байрлал алдагдсан кадар ийм тоо дараалвал rep цуцлана
const VIS_MIN    = 0.5;   // цэгийн итгэлцүүр

// ---- төлөв ----
let landmarker = null, running = false, facing = "environment", stream = null;
let phase = "up", count = 0, repStart = 0, repMinAngle = 180, bestDepth = null;
let smooth = null, lastVideoTime = -1, t0 = 0, fpsEma = 0, lastFrame = 0;
let loSeen = null, hiSeen = null, badFrames = 0, dipMin = 999;

const ARMS = [[11,13,15],[12,14,16]];  // мөр → тохой → бугуй

// Зөвхөн бие. MediaPipe-ийн бэлэн POSE_CONNECTIONS нүүрэн дээр 11 цэг,
// алга/ул дээр бас цэг зурдаг тул зураг эмх замбараагүй болдог.
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],
               [11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const JOINTS = [11,12,13,14,15,16,23,24,25,26,27,28];
const DRAW_VIS = 0.4;  // үүнээс бага итгэлцүүртэй цэг бол таамаг, зурахгүй

function drawSkeleton(lm){
  const W = canvas.width, H = canvas.height;
  const lw = Math.max(3, W/170);
  const at = i => [lm[i].x*W, lm[i].y*H];
  const ok = i => (lm[i].visibility ?? 1) > DRAW_VIS;

  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // сүүдрийг эхлээд — цайвар дэвсгэр дээр цагаан шугам алга болохоос сэргийлнэ
  for(const [color, width] of [["rgba(0,0,0,.4)", lw*2], ["#ffffff", lw]]){
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath();
    for(const [a,b] of BONES){
      if(!ok(a) || !ok(b)) continue;
      const [ax,ay] = at(a), [bx,by] = at(b);
      ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
    }
    ctx.stroke();
  }
  for(const i of JOINTS){
    if(!ok(i)) continue;
    const [x,y] = at(i);
    ctx.beginPath(); ctx.arc(x, y, lw*1.8, 0, Math.PI*2);
    ctx.fillStyle = "#ffd21e"; ctx.fill();
    ctx.lineWidth = lw*0.4; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();
  }
}

const seen = (lm,i) => (lm[i].visibility ?? 1) > VIS_MIN;

// Өнцгийг worldLandmarks (метр, 3D) дээр бодно. 2D зураг дээр бодвол камерын
// өнцгөөс болж өнцөг богиносч, тохой бүрэн нугалсныг ч танихгүй байдаг.
function angle3(a, b, c){
  const ax=a.x-b.x, ay=a.y-b.y, az=a.z-b.z;
  const cx=c.x-b.x, cy=c.y-b.y, cz=c.z-b.z;
  const m = Math.hypot(ax,ay,az) * Math.hypot(cx,cy,cz);
  if(!m) return null;
  return Math.acos(Math.max(-1, Math.min(1, (ax*cx+ay*cy+az*cz)/m))) * 180/Math.PI;
}

function meanAngle(world, lm, triples){
  const vals = [];
  for(const [a,b,c] of triples){
    if(seen(lm,a) && seen(lm,b) && seen(lm,c)){
      const v = angle3(world[a], world[b], world[c]);
      if(v!=null) vals.push(v);
    }
  }
  if(!vals.length) return null;
  return vals.reduce((x,y)=>x+y,0)/vals.length;
}

const mean = (lm, idx) => {
  const v = idx.filter(i => seen(lm,i));
  return v.length ? v.reduce((s,i) => s + lm[i].y, 0)/v.length : null;
};

// Push-up байрлалд байгаа эсэх. Тохойн өнцөг ганцаараа хангалтгүй —
// сууж байгаад гараа нугалахад ч тохой яг адилхан нугалагдана.
// Буцаах утга: болзол хангасан бол null, үгүй бол шалтгаан.
// Бие босоо байна уу. Хөл кадрт багтахыг шаардахгүйн тулд мөр→аарцаг
// тэнхлэгээр шүүнэ:
//   horiz — тэнхлэг зурган дээр хэр хэвтээ байна (хажуугаас харах push-up)
//   fore  — тэнхлэг хэр богиносч харагдаж байна. Мөрний бодит өргөнөөр
//           масштаб гаргаж, бие камер руу чиглэснийг таана (нүүрээрээ push-up)
// Зогсож байгаа хүн хоёуланд нь унана.
function bodyAxis(lm, world, aspect){
  const shX=(lm[11].x+lm[12].x)/2*aspect, shY=(lm[11].y+lm[12].y)/2;
  const hpX=(lm[23].x+lm[24].x)/2*aspect, hpY=(lm[23].y+lm[24].y)/2;
  const len = Math.hypot(shX-hpX, shY-hpY);
  const horiz = len ? Math.abs(shX-hpX)/len : 0;

  const shImg = Math.hypot((lm[11].x-lm[12].x)*aspect, lm[11].y-lm[12].y);
  const shW = Math.hypot(world[11].x-world[12].x, world[11].y-world[12].y, world[11].z-world[12].z);
  const torsoW = Math.hypot(
    (world[11].x+world[12].x - world[23].x-world[24].x)/2,
    (world[11].y+world[12].y - world[23].y-world[24].y)/2,
    (world[11].z+world[12].z - world[23].z-world[24].z)/2);
  const expected = shW ? torsoW * (shImg/shW) : 0;
  return { horiz, fore: expected ? len/expected : 1 };
}

function positionCheck(lm, world, aspect){
  const wristY = mean(lm, [15,16]);
  const hipY   = mean(lm, [23,24]);
  if(wristY === null || hipY === null) return "Бүтэн биеэ камерт багтаа";
  // зурган дээр y доошоо өснө: гар шалан дээр бол бугуй аарцгаас доогуур байна
  if(wristY <= hipY) return "Гараа шалан дээр тавь";
  if(seen(lm,11) && seen(lm,12) && seen(lm,23) && seen(lm,24)){
    const { horiz, fore } = bodyAxis(lm, world, aspect);
    if(horiz < 0.5 && fore > 0.7) return "Push-up байрлалд ор";
  }
  // Мөр–аарцаг–өвдөг өнцгөөр "бие шулуун уу" гэж шалгахыг больсон: камер
  // ойрхон, бие нь камераас хол чиглэсэн үед доод биеийн цэгүүд таамаглал
  // болж, өнцөг нь утгагүй гарч ирээд тоолохыг бүрмөсөн хаадаг байсан.
  return null;
}

function setMsg(text, color){
  const el = $("msg");
  el.textContent = text;
  el.style.color = color || "var(--fg)";
}

// Ажиглагдсан доод/дээд өнцгийн муж. Шинэ хязгаарт шууд тэлж, дараа нь
// аажим нарийсдаг тул хэрэглэгч гүнзгий/гүехэн хийхээ өөрчилвөл дагаж тохирно.
function envelope(deg){
  // Нарийсах хурд удаан байх ёстой: хурдан нарийсвал хагас push-up дараалан
  // хийхэд lo нь дээшилж, хагас нь "бүтэн" болж хувирдаг. 0.005/кадар
  // гэдэг нь 60 fps дээр секундэд 0.3° — нэг гүн rep удаан хугацаанд жишиг
  // болж үлдэнэ.
  loSeen = loSeen === null ? deg : Math.min(deg, loSeen + 0.005);
  hiSeen = hiSeen === null ? deg : Math.max(deg, hiSeen - 0.005);
  const range = hiSeen - loSeen;
  if(range < MIN_SWING) return null;
  // мужийн 75%-ийг буусан үед л "буусан" гэж тооцно
  return { down: loSeen + range*0.25, up: loSeen + range*0.70, range };
}

function countRep(deg, now, th){
  if(deg < repMinAngle) repMinAngle = deg;

  if(phase === "up"){
    if(deg < dipMin) dipMin = deg;
    if(deg < th.down){
      phase = "down"; repStart = now; repMinAngle = deg; dipMin = 999;
      if(navigator.vibrate) navigator.vibrate(12);
      setMsg("Доошоо ✓", "var(--warn)");
    }
    // Буусан ч гүнд хүрээгүй бол яагаад тоологдоогүйг хэлнэ
    else if(deg > th.up && dipMin < th.up - 5){
      setMsg("Гүн дутуу — доошоо буу", "var(--bad)");
      dipMin = 999;
    }
  }
  else if(phase === "down" && deg > th.up){
    phase = "up";
    if(now - repStart >= MIN_REP_MS){
      count++;
      $("count").textContent = count;
      // reflow-гүйгээр дахин ижил класс өгвөл анимаци дахин эхлэхгүй
      const c = $("counter");
      c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
      if(bestDepth === null || repMinAngle < bestDepth){
        bestDepth = repMinAngle;
        $("deep").textContent = Math.round(bestDepth) + "°";
      }
      if(navigator.vibrate) navigator.vibrate([18,40,18]);
      setMsg(`${count} — сайн байна!`, "var(--accent)");
    } else {
      setMsg("Хэт хурдан — бүтэн хий", "var(--bad)");
    }
    repMinAngle = 180;
  }
}

// Байрлал алдагдсан үед хагас rep-ийг цуцалж, дараа нь дуусгахаас сэргийлнэ
function idle(){
  phase = "up"; repMinAngle = 180; smooth = null;
  $("angle").textContent = "–";
  $("meter").style.height = "0%";
}

function loop(){
  if(!running) return;
  requestAnimationFrame(loop);
  if(video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const now = performance.now();
  if(lastFrame){
    const f = 1000/(now-lastFrame);
    fpsEma = fpsEma ? fpsEma*0.9 + f*0.1 : f;
    $("fps").textContent = Math.round(fpsEma);
  }
  lastFrame = now;

  if(canvas.width !== video.videoWidth){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  const res = landmarker.detectForVideo(video, now);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const lm = res.landmarks && res.landmarks[0];
  const world = res.worldLandmarks && res.worldLandmarks[0];
  if(!lm || !world){
    setMsg("Хүн олдсонгүй — бүтэн биеэ багтаа", "var(--dim)");
    if(++badFrames >= BAD_FRAMES) idle();
    return;
  }

  drawSkeleton(lm);

  // оношлогоо: аль шүүлтүүр саатуулж байгааг утсан дээрээс харах
  const asp = canvas.width/canvas.height;
  const ax = (seen(lm,11)&&seen(lm,12)&&seen(lm,23)&&seen(lm,24)) ? bodyAxis(lm,world,asp) : null;
  const f2 = v => v === null ? "–" : v.toFixed(2);
  const r0 = v => v === null ? "–" : Math.round(v);
  $("poseDiag").textContent = `h${f2(ax&&ax.horiz)} f${f2(ax&&ax.fore)}`
    + ` lo${r0(loSeen)} hi${r0(hiSeen)} ${phase}`;

  const bad = positionCheck(lm, world, asp);
  if(bad){
    setMsg(bad, "var(--dim)");
    // Нэг муу кадарт rep-ийг цуцлахгүй — доод цэгт бугуй халхлагдахад
    // цэгийн итгэлцүүр хэсэг зуур унадаг тул бүх rep алдагдаж байсан.
    if(++badFrames >= BAD_FRAMES) idle();
    return;
  }

  const raw = meanAngle(world, lm, ARMS);
  if(raw === null){
    setMsg("Гар харагдахгүй байна", "var(--dim)");
    if(++badFrames >= BAD_FRAMES) idle();
    return;
  }
  badFrames = 0;

  smooth = smooth === null ? raw : smooth*0.5 + raw*0.5;
  const deg = smooth;
  $("angle").textContent = Math.round(deg) + "°";

  const th = envelope(deg);
  if(!th){
    setMsg("Тохируулж байна — нэг удаа бүтэн хий", "var(--dim)");
    $("meter").style.height = "0%";
    return;
  }

  // 0% = бүтэн доош, 100% = бүтэн дээш
  const pct = Math.max(0, Math.min(1, (deg - th.down) / (th.up - th.down)));
  $("meter").style.height = (pct*100) + "%";
  $("meter").style.background = pct < 0.05 ? "var(--warn)" : "var(--accent)";

  countRep(deg, now, th);

  const s = Math.floor((now - t0)/1000);
  $("time").textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}

function reset(){
  count = 0; phase = "up"; repMinAngle = 180; bestDepth = null; smooth = null;
  loSeen = null; hiSeen = null; badFrames = 0; dipMin = 999;
  t0 = performance.now();
  $("count").textContent = 0;
  $("counter").classList.remove("pop");
  $("deep").textContent = "–";
  $("time").textContent = "0:00";
  setMsg("Эхлэхэд бэлэн");
}

async function openCamera(){
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width:{ideal:1280}, height:{ideal:720} },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  const front = facing === "user";
  video.classList.toggle("mirror", front);
  canvas.classList.toggle("mirror", front);
}

async function start(){
  const err = $("err");
  try{
    $("go").disabled = true;
    $("go").textContent = "Ачаалж байна…";
    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error("Камер дэмжихгүй байна. HTTPS эсвэл localhost дээр нээнэ үү.");

    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: {
        // full: 60 fps гарч байгаа тул нөөц бий. lite нь доод биеийн цэгүүдийг
        // ойрын өнцгөөс сайн танихгүй байсан.
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numPoses: 1,
      minPoseDetectionConfidence: 0.5,
      minPosePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    await openCamera();
    $("start").classList.add("hidden");
    running = true;
    reset();
    loop();
  }catch(e){
    err.classList.remove("hidden");
    err.textContent = e.message || String(e);
    $("go").disabled = false;
    $("go").textContent = "Дахин оролдох";
  }
}

$("go").onclick = start;
$("reset").onclick = reset;
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try{ await openCamera(); }catch(e){ setMsg("Камер солиход алдаа гарлаа", "var(--bad)"); }
};
document.addEventListener("visibilitychange", () => {
  if(document.hidden) lastFrame = 0;
});
</script>
